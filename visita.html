<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visita Técnica</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="location.href='index.html'">← Voltar</button>
  <div>
    <h1>🔍 Visita Técnica</h1>
    <div class="subtitle">Registro de vistoria no local</div>
  </div>
</div>

<div class="container">
  <div id="alerta" class="alerta"></div>
  <form id="formVisita">

    <div class="card">
      <h2>📋 Identificação</h2>
      <div class="form-group">
        <label>Estabelecimento <span class="obrigatorio">*</span></label>
        <select id="estabelecimento" required>
          <option value="">Carregando lista...</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Data da Visita <span class="obrigatorio">*</span></label>
          <input type="date" id="dataVisita" required>
        </div>
        <div class="form-group">
          <label>Responsável pela Visita <span class="obrigatorio">*</span></label>
          <input type="text" id="responsavelVisita" required>
        </div>
      </div>
      <div class="form-group">
        <label>Contato no Local <span class="opcional">(opcional)</span></label>
        <input type="text" id="contatoLocal">
      </div>
    </div>

    <div class="card">
      <h2>⚡ Infraestrutura Geral</h2>
      <div class="form-group">
        <label>Internet disponível no local? <span class="obrigatorio">*</span></label>
        <select id="internetLocal" required onchange="toggleWifi(this.value)">
          <option value="">Selecione...</option>
          <option>Sim</option>
          <option>Não</option>
        </select>
      </div>
      <div id="camposWifi" style="display:none;">
        <div class="form-row">
          <div class="form-group">
            <label>Tipo de Conexão</label>
            <select id="tipoConexao">
              <option value="">Selecione...</option>
              <option>Wi-Fi</option>
              <option>Cabo (Ethernet)</option>
              <option>Ambos</option>
            </select>
          </div>
          <div class="form-group">
            <label>Qualidade do Sinal Wi-Fi</label>
            <select id="qualidadeWifi">
              <option value="">Selecione...</option>
              <option>Excelente</option>
              <option>Boa</option>
              <option>Regular</option>
              <option>Fraca</option>
              <option>Não testado</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Senha do Wi-Fi <span class="opcional">(opcional)</span></label>
          <input type="text" id="senhaWifi">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Tensão Elétrica <span class="obrigatorio">*</span></label>
          <select id="tensaoEletrica" required>
            <option value="">Selecione...</option>
            <option>110V / 127V</option>
            <option>220V</option>
            <option>Ambas</option>
            <option>Não verificado</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tomadas Próximas? <span class="obrigatorio">*</span></label>
          <select id="tomadasProximas" required>
            <option value="">Selecione...</option>
            <option>Sim, em todos os pontos</option>
            <option>Em alguns pontos</option>
            <option>Em nenhum ponto</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Extensão ou Régua necessária?</label>
        <select id="extensaoNecessaria">
          <option value="">Selecione...</option>
          <option>Sim</option>
          <option>Não</option>
          <option>A avaliar</option>
        </select>
      </div>
      <div class="form-group">
        <label>Observações de Infraestrutura <span class="opcional">(opcional)</span></label>
        <textarea id="obsInfraestrutura"></textarea>
      </div>
    </div>

    <div class="card">
      <h2>📺 Pontos de Instalação</h2>
      <div id="listaPontos"></div>
      <button type="button" class="btn-add-ponto" onclick="adicionarPonto()">+ Adicionar Ponto de Instalação</button>
    </div>

    <div class="card">
      <h2>📊 Resumo da Visita</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Total de Pontos Mapeados <span class="obrigatorio">*</span></label>
          <input type="number" id="totalPontos" required min="0">
        </div>
        <div class="form-group">
          <label>Viabilidade Técnica Geral <span class="obrigatorio">*</span></label>
          <select id="viabilidadeGeral" required>
            <option value="">Selecione...</option>
            <option>Totalmente viável</option>
            <option>Viável com pequenas adaptações</option>
            <option>Viável com adaptações significativas</option>
            <option>Inviável no momento</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Principais Desafios <span class="opcional">(opcional)</span></label>
        <textarea id="desafios"></textarea>
      </div>
      <div class="form-group">
        <label>Materiais Necessários <span class="obrigatorio">*</span></label>
        <textarea id="materiaisNecessarios" required></textarea>
      </div>
      <div class="form-group">
        <label>Equipamentos a Separar/Comprar <span class="obrigatorio">*</span></label>
        <textarea id="equipamentosNecessarios" required></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Data Sugerida para Instalação <span class="opcional">(opcional)</span></label>
          <input type="date" id="dataInstalacao">
        </div>
        <div class="form-group">
          <label>Apoio Externo Necessário?</label>
          <select id="apoioExterno">
            <option value="">Selecione...</option>
            <option>Não</option>
            <option>Sim, eletricista</option>
            <option>Sim, marcenaria</option>
            <option>Sim, outro</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Observações Finais <span class="opcional">(opcional)</span></label>
        <textarea id="observacoesFinais"></textarea>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="btnSubmit">💾 Salvar Visita Técnica</button>
  </form>
</div>

<script>
  var API_URL = 'https://script.google.com/macros/s/AKfycbwtA46Q55_pTTPzTh9aXjQh2syF27IYWk0ZRO50KNhCmEdfOQtKqZ8pKazn7l9mvFuAeg/exec';
  var contadorPontos = 0;

  function toggleWifi(valor) {
    document.getElementById('camposWifi').style.display = valor === 'Sim' ? 'block' : 'none';
  }

  function adicionarPonto() {
    contadorPontos++;
    var id = contadorPontos;
    var div = document.createElement('div');
    div.className = 'secao-ponto';
    div.id = 'ponto-' + id;
    div.innerHTML =
      '<h3>📍 Ponto ' + id + '</h3>' +
      '<button type="button" class="btn-remove" onclick="removerPonto(' + id + ')">✕ Remover</button>' +
      '<div class="form-group"><label>Identificação</label><input type="text" class="ponto-campo" data-campo="identificacao" placeholder="Ex.: Entrada principal"></div>' +
      '<div class="form-row">' +
        '<div class="form-group"><label>Local no Ambiente</label><select class="ponto-campo" data-campo="local"><option value="">Selecione...</option><option>Entrada</option><option>Recepção</option><option>Caixa / Checkout</option><option>Balcão</option><option>Salão / Área principal</option><option>Sala de espera</option><option>Corredor</option><option>Outro</option></select></div>' +
        '<div class="form-group"><label>Tipo de Equipamento</label><select class="ponto-campo" data-campo="tipoEquipamento"><option value="">Selecione...</option><option>TV nova (instalada por nós)</option><option>TV existente do estabelecimento</option><option>Totem LED</option><option>Outro</option></select></div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="form-group"><label>Tamanho Sugerido</label><select class="ponto-campo" data-campo="tamanho"><option value="">Selecione...</option><option>32"</option><option>43"</option><option>50"</option><option>55"</option><option>65"</option><option>A definir</option></select></div>' +
        '<div class="form-group"><label>Orientação da Tela</label><select class="ponto-campo" data-campo="orientacao"><option value="">Selecione...</option><option>Paisagem (horizontal)</option><option>Retrato (vertical)</option><option>A definir</option></select></div>' +
      '</div>' +
      '<div class="form-group"><label>Observações do Ponto</label><textarea class="ponto-campo" data-campo="observacoes"></textarea></div>';
    document.getElementById('listaPontos').appendChild(div);
  }

  function removerPonto(id) {
    var el = document.getElementById('ponto-' + id);
    if (el) el.remove();
  }

  function coletarPontos() {
    var pontos = [];
    document.querySelectorAll('.secao-ponto').forEach(function(secao) {
      var ponto = {};
      secao.querySelectorAll('.ponto-campo').forEach(function(campo) {
        ponto[campo.dataset.campo] = campo.value || '';
      });
      pontos.push(ponto);
    });
    return pontos;
  }

  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('dataVisita').value = new Date().toISOString().split('T')[0];

    fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: 'getEstabelecimentos' }) })
      .then(function(r) { return r.json(); })
      .then(function(lista) {
        var select = document.getElementById('estabelecimento');
        select.innerHTML = '<option value="">Selecione...</option>';
        if (!lista || lista.length === 0) {
          select.innerHTML = '<option value="">Nenhum estabelecimento cadastrado</option>';
          return;
        }
        lista.forEach(function(est) {
          var opt = document.createElement('option');
          opt.value = est.nome;
          opt.textContent = est.nome;
          select.appendChild(opt);
        });
      })
      .catch(function() {
        document.getElementById('estabelecimento').innerHTML = '<option value="">Erro ao carregar</option>';
      });
  });

  document.getElementById('formVisita').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('btnSubmit');
    var alerta = document.getElementById('alerta');
    alerta.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<span class="loading"></span> Salvando...';

    var dados = {
      acao: 'salvarVisita',
      estabelecimento: document.getElementById('estabelecimento').value,
      dataVisita: document.getElementById('dataVisita').value,
      responsavelVisita: document.getElementById('responsavelVisita').value,
      contatoLocal: document.getElementById('contatoLocal').value,
      internetLocal: document.getElementById('internetLocal').value,
      tipoConexao: document.getElementById('tipoConexao').value,
      qualidadeWifi: document.getElementById('qualidadeWifi').value,
      senhaWifi: document.getElementById('senhaWifi').value,
      tensaoEletrica: document.getElementById('tensaoEletrica').value,
      tomadasProximas: document.getElementById('tomadasProximas').value,
      extensaoNecessaria: document.getElementById('extensaoNecessaria').value,
      obsInfraestrutura: document.getElementById('obsInfraestrutura').value,
      totalPontos: document.getElementById('totalPontos').value,
      viabilidadeGeral: document.getElementById('viabilidadeGeral').value,
      desafios: document.getElementById('desafios').value,
      materiaisNecessarios: document.getElementById('materiaisNecessarios').value,
      equipamentosNecessarios: document.getElementById('equipamentosNecessarios').value,
      dataInstalacao: document.getElementById('dataInstalacao').value,
      apoioExterno: document.getElementById('apoioExterno').value,
      observacoesFinais: document.getElementById('observacoesFinais').value,
      pontos: coletarPontos()
    };

    fetch(API_URL, { method: 'POST', body: JSON.stringify(dados) })
      .then(function(r) { return r.json(); })
      .then(function(resultado) {
        if (resultado.sucesso) {
          alerta.className = 'alerta sucesso';
          alerta.innerHTML = '✅ ' + resultado.mensagem + ' | ID: ' + resultado.id;
          document.getElementById('formVisita').reset();
          document.getElementById('listaPontos').innerHTML = '';
          contadorPontos = 0;
        } else {
          alerta.className = 'alerta erro';
          alerta.innerHTML = '❌ ' + resultado.mensagem;
        }
        alerta.style.display = 'block';
        window.scrollTo(0, 0);
        btn.disabled = false;
        btn.innerHTML = '💾 Salvar Visita Técnica';
      })
      .catch(function(err) {
        alerta.className = 'alerta erro';
        alerta.innerHTML = '❌ Erro de conexão: ' + err.message;
        alerta.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '💾 Salvar Visita Técnica';
      });
  });
</script>
</body>
</html>
